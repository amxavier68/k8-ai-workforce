name: Static model-retirement CI

on:
  pull_request:
    paths:
      - "changes/2026-08-25-openai-model-retirements.md"
      - "tests/2026-08-25-openai-model-retirements.json"
      - "scripts/static-ci-model-retirements.mjs"
      - ".github/workflows/static-ci-model-retirements.yml"

permissions:
  contents: read

jobs:
  model-retirement-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate governed model-retirement change
        run: node scripts/static-ci-model-retirements.mjs
