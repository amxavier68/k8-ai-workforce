name: AI Workforce CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-workforce-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workforce contracts
        run: python scripts/validate_workforce.py
