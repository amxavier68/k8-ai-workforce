name: Static knowledge-patch CI

on:
  pull_request:
    paths:
      - "knowledge-patches/**"
      - "scripts/static-ci-knowledge-patches.mjs"
      - ".github/workflows/static-ci-knowledge-patches.yml"

permissions:
  contents: read

jobs:
  knowledge-patch-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate canonical knowledge promotion
        run: node scripts/static-ci-knowledge-patches.mjs
